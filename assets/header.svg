<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
@keyframes drift-r{0%,100%{transform:translate(0,0);opacity:.6}50%{transform:translate(35px,-18px);opacity:1}}
@keyframes drift-l{0%,100%{transform:translate(0,0);opacity:.55}50%{transform:translate(-30px,16px);opacity:.95}}
@keyframes drift-u{0%,100%{transform:translate(0,0);opacity:.7}50%{transform:translate(25px,-25px);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.2);opacity:.35}}
@keyframes scan{0%{transform:translate(-900px,0)}100%{transform:translate(900px,0)}}
@keyframes ring{0%,100%{opacity:.15}50%{opacity:.4}}
@keyframes draw{0%{stroke-dashoffset:500}100%{stroke-dashoffset:0}}
@keyframes dot{0%,100%{opacity:.35}50%{opacity:.9}}
.dr{animation:drift-r 8s ease-in-out infinite}.dl{animation:drift-l 9s ease-in-out infinite .3s}
.du{animation:drift-u 7s ease-in-out infinite .6s}.p{animation:pulse 6s ease-in-out infinite}
.scan{animation:scan 4.5s linear infinite}.ring{animation:ring 4s ease-in-out infinite}
.draw{animation:draw 3s ease-in-out infinite;stroke-dasharray:250 250}.dot{animation:dot 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="g1"><stop offset="0%" stop-color="rgba(120,40,255,.6)"/><stop offset="100%" stop-color="rgba(120,40,255,0)"/></radialGradient>
<radialGradient id="g2"><stop offset="0%" stop-color="rgba(0,200,220,.5)"/><stop offset="100%" stop-color="rgba(0,200,220,0)"/></radialGradient>
<radialGradient id="g3"><stop offset="0%" stop-color="rgba(220,40,200,.45)"/><stop offset="100%" stop-color="rgba(220,40,200,0)"/></radialGradient>
<radialGradient id="g4"><stop offset="0%" stop-color="rgba(40,120,255,.4)"/><stop offset="100%" stop-color="rgba(40,120,255,0)"/></radialGradient>
<linearGradient id="scg"><stop offset="0%" stop-color="rgba(120,200,255,0)"/><stop offset="50%" stop-color="rgba(160,120,255,.45)"/><stop offset="100%" stop-color="rgba(120,200,255,0)"/></linearGradient>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0%" stop-color="#7ee7ff"/><stop offset="50%" stop-color="#e8c8ff"/><stop offset="100%" stop-color="#ff88cc"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="rgba(110,80,220,.08)" stroke-width=".5"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="300" rx="24" fill="#060610" stroke="rgba(110,80,220,.25)" stroke-width="1.5"/>
<rect width="800" height="300" rx="24" fill="url(#grid)"/>
<ellipse class="dr" cx="200" cy="140" rx="180" ry="110" fill="url(#g1)"/>
<ellipse class="dl" cx="620" cy="160" rx="160" ry="95" fill="url(#g2)"/>
<ellipse class="du" cx="420" cy="110" rx="140" ry="90" fill="url(#g3)"/>
<ellipse class="p" cx="100" cy="180" rx="120" ry="80" fill="url(#g4)"/>
<rect class="scan" x="-200" y="120" width="400" height="40" fill="url(#scg)" opacity=".35"/>
<circle class="ring" cx="400" cy="140" r="120" fill="none" stroke="rgba(120,200,255,.2)" stroke-width=".8"/>
<circle class="ring" cx="400" cy="140" r="80" fill="none" stroke="rgba(200,120,255,.15)" stroke-width=".6" style="animation-delay:.5s"/>
<path class="draw" d="M30 24L30 12L46 12" fill="none" stroke="rgba(126,231,255,.7)" stroke-width="2.5" stroke-linecap="round"/>
<path class="draw" d="M770 24L770 12L754 12" fill="none" stroke="rgba(232,200,255,.7)" stroke-width="2.5" stroke-linecap="round" style="animation-delay:.5s"/>
<path class="draw" d="M30 276L30 288L46 288" fill="none" stroke="rgba(255,136,204,.6)" stroke-width="2.5" stroke-linecap="round" style="animation-delay:1s"/>
<path class="draw" d="M770 276L770 288L754 288" fill="none" stroke="rgba(126,231,255,.5)" stroke-width="2.5" stroke-linecap="round" style="animation-delay:1.5s"/>
<circle class="dot" cx="60" cy="75" r="2" fill="#7ee7ff"/><circle class="dot" cx="740" cy="185" r="2" fill="#e8c8ff" style="animation-delay:1.5s"/><circle class="dot" cx="700" cy="90" r="1.5" fill="#ff88cc" style="animation-delay:2.5s"/>
<text x="400" y="104" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="48" font-weight="900" fill="#fff" letter-spacing="14" filter="url(#glow)">SANJAY J</text>
<text x="400" y="146" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="rgba(126,231,255,.95)" letter-spacing="6" font-weight="700">AI/ML &amp; FULL-STACK ENGINEER</text>
<line x1="260" y1="164" x2="540" y2="164" stroke="url(#tg)" stroke-width="1" opacity=".6" filter="url(#glow)"/>
<text x="400" y="192" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="rgba(232,200,255,.85)" letter-spacing="3" font-weight="600">DATA SYSTEMS  |  LLM APPLICATIONS</text>
<text x="400" y="217" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="9.5" fill="rgba(126,231,255,.6)" letter-spacing="2" font-weight="500">FASTIFY  •  POSTGRESQL  •  RAG  •  REACT</text>
<text x="400" y="248" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="9" fill="rgba(140,140,180,.6)" letter-spacing="1.5">github.com/sanjay-tech-io</text>
</svg>